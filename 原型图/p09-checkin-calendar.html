<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>09 · 打卡记录</title>
<style>
:root{--green:#3D9A63;--deep:#2C7A4B;--cream:#F7F9EE;--ink:#2F3B33;--muted:#8A9689;--sun:#F5B840;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(61,154,99,.16),transparent),#D8E2C4;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:44px 0}
.caption{color:#57684F;font-size:13px;letter-spacing:.1em}
.phone{width:396px;background:#141B13;border-radius:52px;padding:10px;box-shadow:0 34px 70px rgba(40,70,45,.4)}
.screen{width:376px;height:814px;border-radius:42px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;font-weight:700;flex-shrink:0}
.status .icons{display:flex;gap:5px}
.sig{width:17px;height:11px;background:#1d241c;border-radius:2px;clip-path:polygon(0 100%,20% 100%,20% 66%,40% 66%,40% 33%,60% 33%,60% 0,100% 0,100% 100%)}
.batt{width:24px;height:12px;border:1.5px solid #1d241c;border-radius:3.5px;position:relative}
.batt::after{content:"";position:absolute;inset:2px 7px 2px 2px;background:#1d241c;border-radius:1.5px}
.nav{height:46px;display:flex;align-items:center;padding:0 14px;position:relative;flex-shrink:0}
.nav .back{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,120,80,.12)}
.nav .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16.5px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:2px 18px 18px}
/* 今日状态置顶 */
.today{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,#57B47E,#2C7A4B);border-radius:22px;padding:18px;color:#fff;box-shadow:0 10px 24px rgba(44,122,75,.28)}
.today .ok{flex-shrink:0;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.today h3{font-size:17px;white-space:nowrap}
.today p{font-size:12px;opacity:.85;margin-top:3px;white-space:nowrap}
.today .days{margin-left:auto;text-align:center;flex-shrink:0}
.today .days b{font-size:34px;font-weight:900;line-height:1}
.today .days span{display:block;font-size:11px;opacity:.85;margin-top:2px}
/* 里程碑 */
.miles{margin-top:12px;background:#fff;border:1.5px solid #E2EADC;border-radius:18px;padding:14px 16px;box-shadow:0 4px 12px rgba(60,120,80,.07)}
.miles .row{display:flex;align-items:center;gap:8px}
.miles h5{font-size:14px}
.miles h5 b{color:#E8834A}
.miles span{margin-left:auto;font-size:11.5px;color:var(--muted)}
.miles .track{margin-top:10px;display:flex;gap:6px;align-items:center}
.miles .paw{flex:1;height:10px;border-radius:999px;background:#EDF2E2;overflow:hidden;position:relative}
.miles .paw i{display:block;width:86%;height:100%;background:linear-gradient(90deg,#8FD09A,#2C7A4B);border-radius:999px}
.miles .medal{flex-shrink:0;width:30px;height:30px;border-radius:10px;background:#EDF2E2;display:flex;align-items:center;justify-content:center}
/* 日历 */
.cal-head{display:flex;align-items:center;margin:18px 2px 10px}
.cal-head h4{font-size:16px;font-weight:800}
.cal-head .nav-m{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--deep)}
.cal-head .nav-m button{width:28px;height:28px;border:none;border-radius:10px;background:#fff;box-shadow:0 2px 6px rgba(60,120,80,.1);color:var(--deep);font-size:13px}
.cal{background:#fff;border:1.5px solid #E2EADC;border-radius:20px;padding:16px 14px;box-shadow:0 5px 16px rgba(60,120,80,.08)}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px}
.day{position:relative;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink);font-weight:600}
.day.done{color:var(--deep)}
.day.done::after{content:"";position:absolute;bottom:1px;width:11px;height:11px;background:no-repeat center/contain url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%233D9A63"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg>')}
.day.miss{color:#C3CCC0;text-decoration:line-through}
.day.future{color:#B8C2B5}
.day.today-cell{background:var(--deep);color:#fff;border-radius:12px;box-shadow:0 4px 10px rgba(44,122,75,.35)}
.day.today-cell.done{color:#fff}
/* 说明 */
.note{margin-top:12px;display:flex;gap:10px;background:#EFF6E4;border-radius:16px;padding:12px 14px;font-size:11.5px;color:#5F7D5A;line-height:1.6}
.note svg{flex-shrink:0;margin-top:1px}
.home-ind{flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center}
.home-ind i{width:130px;height:5px;border-radius:999px;background:#1d241c;opacity:.8}
</style>
</head>
<body>
<span class="caption">09 · 打卡记录（FR-B2 · 小狗脚印月历 · 不设补卡 · 里程碑可生成分享卡）</span>
<div class="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="icons"><span class="sig"></span><span class="batt"></span></span></div>
  <div class="nav">
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3B33" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <span class="title">打卡记录</span>
  </div>

  <div class="content">
    <div class="today">
      <div class="ok"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#2C7A4B" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div>
      <div><h3>今天已打卡</h3><p>3 个任务全部完成 · 19:12</p></div>
      <div class="days"><b>6</b><span>连续天数</span></div>
    </div>

    <div class="miles">
      <div class="row"><h5>距离 <b>7 天小勇士</b> 还差 1 天</h5><span>7 / 30 / 100 天</span></div>
      <div class="track">
        <div class="paw"><i></i></div>
        <div class="medal"><svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="10" r="6" fill="#C9D4BE"/><circle cx="12" cy="10" r="3" fill="#fff"/><path d="M8.5 15 7 20l5-2.6L17 20l-1.5-5" fill="#C9D4BE"/></svg></div>
      </div>
    </div>

    <div class="cal-head">
      <h4>2026 年 8 月</h4>
      <div class="nav-m"><button>‹</button><span>本月已打卡 12 天</span><button>›</button></div>
    </div>
    <div class="cal">
      <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="days">
        <span class="day miss">1</span><span class="day done">2</span><span class="day done">3</span><span class="day miss">4</span><span class="day done">5</span><span class="day done">6</span><span class="day done">7</span>
        <span class="day miss">8</span><span class="day done">9</span><span class="day done">10</span><span class="day done">11</span><span class="day done">12</span><span class="day miss">13</span><span class="day done">14</span>
        <span class="day done">15</span><span class="day done">16</span><span class="day miss">17</span><span class="day future">18</span><span class="day future">19</span><span class="day future">20</span><span class="day future">21</span>
        <span class="day future">22</span><span class="day future">23</span><span class="day future">24</span><span class="day future">25</span><span class="day future">26</span><span class="day future">27</span><span class="day future">28</span>
        <span class="day today-cell done">29</span><span class="day future">30</span><span class="day future">31</span>
      </div>
    </div>

    <div class="note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="#3D9A63"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg>
      <span>当天 3 个任务全部完成即为打卡成功，脚印会盖在日历上。连续中断后从 1 重新计数，不支持补卡——每天坚持本身最珍贵。达成 7 / 30 / 100 天可生成分享卡，晒到家长群。</span>
    </div>
  </div>
  <div class="home-ind"><i></i></div>
</div></div>
</body>
</html>
