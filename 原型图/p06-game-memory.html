<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>06 · 卡片翻翻乐（游戏中）</title>
<style>
:root{--green:#3D9A63;--deep:#2C7A4B;--cream:#F7F9EE;--ink:#2F3B33;--muted:#8A9689;--sun:#F5B840;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(61,154,99,.16),transparent),#D8E2C4;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:44px 0}
.caption{color:#57684F;font-size:13px;letter-spacing:.1em}
.phone{width:396px;background:#141B13;border-radius:52px;padding:10px;box-shadow:0 34px 70px rgba(40,70,45,.4)}
.screen{width:376px;height:814px;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(180deg,#FDF3DC 0%,#F5F7E9 40%,#F7F9EE 100%)}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;font-weight:700;flex-shrink:0}
.status .icons{display:flex;gap:5px}
.sig{width:17px;height:11px;background:#1d241c;border-radius:2px;clip-path:polygon(0 100%,20% 100%,20% 66%,40% 66%,40% 33%,60% 33%,60% 0,100% 0,100% 100%)}
.batt{width:24px;height:12px;border:1.5px solid #1d241c;border-radius:3.5px;position:relative}
.batt::after{content:"";position:absolute;inset:2px 7px 2px 2px;background:#1d241c;border-radius:1.5px}
.gnav{height:46px;display:flex;align-items:center;padding:0 16px;flex-shrink:0}
.gnav .back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,120,80,.12)}
.gnav .lv{margin:0 auto;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--deep)}
.gnav .lv .pill{background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;box-shadow:0 2px 8px rgba(60,120,80,.1);font-weight:700}
.content{flex:1;display:flex;flex-direction:column;padding:2px 20px 16px}
.meta{display:flex;gap:10px;margin:4px 0 14px}
.meta .chip{flex:1;background:#fff;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(60,120,80,.08)}
.meta .chip b{font-size:15px;color:var(--ink)}
.meta .chip span{font-size:11px;color:var(--muted)}
.meta .chip .ic{width:28px;height:28px;border-radius:10px;background:#EDF2E2;display:flex;align-items:center;justify-content:center;font-size:14px}
/* 牌阵 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.card{aspect-ratio:3/4;border-radius:16px;position:relative;transform-style:preserve-3d;box-shadow:0 6px 14px rgba(60,120,80,.14)}
.card .face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.card .back{background:linear-gradient(150deg,#57B47E,#2C7A4B);border:3px solid #fff}
.card .back .paw{opacity:.9}
.card .front{background:#fff;border:2px solid #F0E4C2;transform:rotateY(180deg);backface-visibility:hidden}
.card .b2{transform:rotateY(180deg);backface-visibility:hidden}
.card.flipped{background:#fff}
.card.front-side .back{display:none}
.card.front-side .front{transform:none;backface-visibility:visible}
.card.matched{outline:3px solid #8FD09A;outline-offset:2px}
.card.matched::after{content:"✓";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:#3D9A63;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(44,122,75,.4)}
.card .big{font-size:24px;font-weight:900;color:var(--deep)}
.card .pny{font-size:15px;font-weight:800;color:#E8834A}
.card .lbl{font-size:10.5px;color:var(--muted)}
.card .emoji{font-size:30px}
/* 底部提示 */
.speak{margin-top:auto;background:#FFF6DE;border:1.5px solid #F3D48A;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.speak .horn{flex-shrink:0;width:38px;height:38px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(176,119,8,.15)}
.speak p{font-size:12.5px;color:#8A5E06;line-height:1.55}
.speak p b{font-size:14px}
.tipbar{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);padding:0 4px}
.tipbar .mode{display:flex;align-items:center;gap:6px}
.switch{width:40px;height:22px;border-radius:999px;background:#3D9A63;position:relative}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.home-ind{flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center}
.home-ind i{width:130px;height:5px;border-radius:999px;background:#1d241c;opacity:.8}
</style>
</head>
<body>
<span class="caption">06 · 卡片翻翻乐 · 拼音卡组（FR-G2 · 4 对 8 张 · 配对成功朗读发音）</span>
<div class="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="icons"><span class="sig"></span><span class="batt"></span></span></div>
  <div class="gnav">
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3B33" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="lv">拼音翻翻乐 <span class="pill">第 1 组</span></div>
  </div>

  <div class="content">
    <div class="meta">
      <div class="chip"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="5" width="12" height="14" rx="3.5" fill="#F5B840"/><rect x="9" y="7" width="12" height="14" rx="3.5" fill="#3D9A63" stroke="#fff" stroke-width="1.6"/><path d="M13.2 14.2l2 2 3.4-3.8" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>2 / 4</b><br><span>已配对</span></div></div>
      <div class="chip"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="7" y="4" width="10" height="14" rx="2.5" fill="#E8834A"/><rect x="7" y="4" width="10" height="14" rx="2.5" fill="#fff" opacity=".22"/><path d="M4.6 7.5a9 9 0 0 1 3-3M19.4 16.5a9 9 0 0 1-3 3" stroke="#C9A26B" stroke-width="1.8" stroke-linecap="round"/><path d="M4.2 5.2 4.5 7.8 7 7.2M19.8 18.8l-.3-2.6-2.5.6" stroke="#C9A26B" stroke-width="1.8" fill="#C9A26B" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div><b>7 次</b><br><span>翻牌数</span></div></div>
      <div class="chip"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A7FA8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="7.2"/><path d="M12 9.5V13l2.4 1.8M9.8 3.2h4.4M12 3.2v2.2"/></svg></span><div><b>0:48</b><br><span>用时</span></div></div>
    </div>

    <div class="grid">
      <!-- 已配对：bā -->
      <div class="card front-side matched">
        <div class="face front"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="22" r="10" fill="#F2B56B"/><path d="M13 15 l-3-7 7 3z M27 15 l3-7-7 3z" fill="#E29C55"/><circle cx="17" cy="20" r="1.6" fill="#3A2E22"/><circle cx="23" cy="20" r="1.6" fill="#3A2E22"/><ellipse cx="20" cy="25" rx="2" ry="1.5" fill="#3A2E22"/></svg><span class="lbl">小狗 · bā</span></div>
      </div>
      <div class="card front-side matched">
        <div class="face front"><span class="pny">bā</span><span class="lbl">声调 ˉ</span></div>
      </div>
      <!-- 背面朝上 -->
      <!-- 已配对：mǎ -->
      <div class="card front-side matched">
        <div class="face front"><span class="emoji">🐴</span><span class="lbl">小马 · mǎ</span></div>
      </div>
      <div class="card front-side matched">
        <div class="face front"><span class="pny">mǎ</span><span class="lbl">声调 ˇ</span></div>
      </div>
      <!-- 翻开中 -->
      <div class="card front-side">
        <div class="face front"><svg width="36" height="34" viewBox="0 0 40 40"><path d="M8 30 Q8 12 20 12 Q32 12 32 30 Z" fill="#F5B840"/><circle cx="16" cy="22" r="1.8" fill="#3A2E22"/><circle cx="24" cy="22" r="1.8" fill="#3A2E22"/><ellipse cx="20" cy="27" rx="2.2" ry="1.6" fill="#3A2E22"/><path d="M8 30 q-3 4-1 8 M32 30 q3 4 1 8" stroke="#E29C55" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M20 12 q-1-6 3-8" stroke="#E29C55" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span class="lbl">小猫 · māo</span></div>
      </div>
      <!-- 背面朝上 -->
      <div class="card">
        <div class="face back b2"></div>
        <div class="face back"><svg class="paw" width="30" height="30" viewBox="0 0 24 24" fill="#fff"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg></div>
      </div>
      <div class="card">
        <div class="face back b2"></div>
        <div class="face back"><svg class="paw" width="30" height="30" viewBox="0 0 24 24" fill="#fff"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg></div>
      </div>
      <div class="card">
        <div class="face back b2"></div>
        <div class="face back"><svg class="paw" width="30" height="30" viewBox="0 0 24 24" fill="#fff"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg></div>
      </div>
    </div>

    <div class="speak">
      <div class="horn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8834A" stroke-width="2" stroke-linecap="round"><path d="M4 10v4h3l5 4V6l-5 4z" fill="#F5B840" stroke="#E8834A"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.5 7a8 8 0 0 1 0 10"/></svg></div>
      <p><b>mǎ —— 第三声，小马的 mǎ</b><br>配对成功，跟着读一遍吧</p>
    </div>

    <div class="tipbar">
      <span>全部配对完成即可通关开花 🌼</span>
      <span class="mode">提示模式（4–6 岁默认开）<span class="switch"></span></span>
    </div>
  </div>
  <div class="home-ind"><i></i></div>
</div></div>
</body>
</html>
