<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>07A · 成长花园 · 猫狗萌宠版</title>
<style>
:root{--green:#3D9A63;--deep:#2C7A4B;--cream:#F7F9EE;--ink:#2F3B33;--muted:#8A9689;--sun:#F5B840;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(61,154,99,.16),transparent),#D8E2C4;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:44px 0}
.caption{color:#57684F;font-size:13px;letter-spacing:.1em}
.phone{width:396px;background:#141B13;border-radius:52px;padding:10px;box-shadow:0 34px 70px rgba(40,70,45,.4)}
.screen{width:376px;height:814px;border-radius:42px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:14px;font-weight:700;flex-shrink:0}
.status .icons{display:flex;gap:5px}
.sig{width:17px;height:11px;background:#1d241c;border-radius:2px;clip-path:polygon(0 100%,20% 100%,20% 66%,40% 66%,40% 33%,60% 33%,60% 0,100% 0,100% 100%)}
.batt{width:24px;height:12px;border:1.5px solid #1d241c;border-radius:3.5px;position:relative}
.batt::after{content:"";position:absolute;inset:2px 7px 2px 2px;background:#1d241c;border-radius:1.5px}
.nav{height:46px;display:flex;align-items:center;padding:0 14px;position:relative;flex-shrink:0}
.nav .back{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(60,120,80,.12)}
.nav .title{position:absolute;left:50%;transform:translateX(-50%);font-size:16.5px;font-weight:700}
.content{flex:1;overflow-y:auto;padding:2px 18px 18px}
/* 花园大场景 */
.scene{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#BEE3F5 0%,#D8EEF9 26%,#CDE6C0 27%,#A9D49A 100%);height:220px;box-shadow:0 8px 22px rgba(60,120,80,.14)}
.scene .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.cloud.c1{width:64px;height:20px;top:22px;left:26px}
.cloud.c2{width:44px;height:15px;top:44px;right:48px}
.balance{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.92);border-radius:999px;padding:7px 14px;box-shadow:0 4px 12px rgba(60,120,80,.18)}
.balance b{font-size:16px;color:#B07708}
.balance span{font-size:12px;color:var(--muted)}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:76px}
.scene .dog{position:absolute;bottom:34px;right:26px}
.scene .flowers{position:absolute;bottom:44px;left:22px;display:flex;gap:14px;align-items:flex-end}
.scene .note{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11.5px;color:#3F5D3B}
/* 说明卡 */
.how{margin-top:12px;background:#fff;border:1.5px solid #E2EADC;border-radius:18px;padding:12px 16px;display:flex;gap:14px;box-shadow:0 4px 14px rgba(60,120,80,.07)}
.how .it{flex:1;text-align:center}
.how .it b{display:block;font-size:13.5px;color:var(--deep)}
.how .it span{font-size:11px;color:var(--muted)}
.how .arr{align-self:center;color:#C9D4BE;font-size:18px}
/* 兑换区 */
.sec{margin:18px 2px 10px;font-size:16px;font-weight:800;display:flex;align-items:baseline}
.sec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--green);transform:rotate(45deg);margin-right:8px;vertical-align:2px}
.sec small{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--muted)}
.shop{display:flex;gap:12px}
.item{flex:1;background:#fff;border:1.5px solid #E2EADC;border-radius:20px;padding:14px;text-align:center;box-shadow:0 5px 16px rgba(60,120,80,.08);position:relative}
.item .pic{width:84px;height:84px;margin:0 auto;border-radius:20px;display:flex;align-items:center;justify-content:center}
.item.one .pic{background:linear-gradient(150deg,#FFF3D6,#FFE3B0)}
.item.two .pic{background:linear-gradient(150deg,#E0EEF9,#CBE2F5)}
.item h5{font-size:15px;margin-top:10px}
.item p{font-size:11px;color:var(--muted);margin-top:2px}
.cost{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;font-weight:800;color:#B07708}
.btn-ex{margin-top:10px;width:100%;border:none;border-radius:999px;padding:9px 0;font-size:13.5px;font-weight:800;background:linear-gradient(135deg,#46A86D,#2C7A4B);color:#fff;box-shadow:0 5px 12px rgba(44,122,75,.3)}
.item.locked{opacity:.62}
.item.locked .btn-ex{background:#EDF2E2;color:#A7B39E;box-shadow:none}
.p1tag{position:absolute;top:10px;right:10px;font-size:9.5px;background:rgba(245,184,64,.2);color:#9a6a10;border-radius:999px;padding:2px 7px;font-weight:800}
.mybtns{display:flex;gap:10px;margin-top:16px}
.my{flex:1;background:#fff;border:1.5px solid #E2EADC;border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(60,120,80,.07)}
.my .ic{width:36px;height:36px;border-radius:12px;background:#EDF2E2;display:flex;align-items:center;justify-content:center}
.my h6{font-size:13px}
.my p{font-size:10.5px;color:var(--muted);margin-top:1px}
.home-ind{flex-shrink:0;height:22px;display:flex;align-items:center;justify-content:center}
.home-ind i{width:130px;height:5px;border-radius:999px;background:#1d241c;opacity:.8}
</style>
</head>
<body>
<span class="caption">07A · 成长花园 · 猫狗萌宠版（女孩主题 · FR-A2 · 只正向激励）</span>
<div class="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="icons"><span class="sig"></span><span class="batt"></span></span></div>
  <div class="nav">
    <div class="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F3B33" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <span class="title">成长花园</span>
  </div>

  <div class="content">
    <div class="scene">
      <span class="cloud c1"></span><span class="cloud c2"></span>
      <div class="balance">
        <svg width="17" height="17" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#E8834A"/><g fill="#F5B840"><ellipse cx="12" cy="4.5" rx="3.4" ry="4.5"/><ellipse cx="12" cy="19.5" rx="3.4" ry="4.5"/><ellipse cx="4.5" cy="12" rx="4.5" ry="3.4"/><ellipse cx="19.5" cy="12" rx="4.5" ry="3.4"/></g></svg>
        <b>12</b><span>朵花</span>
      </div>
      <svg class="ground" viewBox="0 0 376 76" preserveAspectRatio="none"><path d="M0 30 Q94 4 188 22 T376 18 V76 H0 Z" fill="#94C984"/></svg>
      <div class="flowers">
        <svg width="40" height="52" viewBox="0 0 40 52"><path d="M20 50 V26" stroke="#4E8F5B" stroke-width="3.4" stroke-linecap="round"/><g transform="translate(20 18)"><g fill="#F5B840"><ellipse cx="0" cy="-11" rx="5" ry="8"/><ellipse cx="0" cy="11" rx="5" ry="8"/><ellipse cx="-11" cy="0" rx="8" ry="5"/><ellipse cx="11" cy="0" rx="8" ry="5"/></g><circle r="5.5" fill="#E8834A"/></g></svg>
        <svg width="48" height="62" viewBox="0 0 48 62"><path d="M24 60 V30" stroke="#4E8F5B" stroke-width="3.6" stroke-linecap="round"/><g transform="translate(24 20)"><g fill="#EC8A6E"><ellipse cx="0" cy="-12" rx="5.5" ry="8.5"/><ellipse cx="0" cy="12" rx="5.5" ry="8.5"/><ellipse cx="-12" cy="0" rx="8.5" ry="5.5"/><ellipse cx="12" cy="0" rx="8.5" ry="5.5"/></g><circle r="6" fill="#FFF7EA"/></g></svg>
        <svg width="34" height="44" viewBox="0 0 34 44"><path d="M17 42 V24" stroke="#4E8F5B" stroke-width="3" stroke-linecap="round"/><g transform="translate(17 16)"><g fill="#F2A0B5"><ellipse cx="0" cy="-9" rx="4.5" ry="7"/><ellipse cx="0" cy="9" rx="4.5" ry="7"/><ellipse cx="-9" cy="0" rx="7" ry="4.5"/><ellipse cx="9" cy="0" rx="7" ry="4.5"/></g><circle r="4.5" fill="#F5B840"/></g></svg>
      </div>
      <svg class="dog" width="86" height="72" viewBox="0 0 86 72">
        <ellipse cx="43" cy="66" rx="30" ry="5" fill="rgba(40,70,40,.18)"/>
        <ellipse cx="43" cy="44" rx="27" ry="20" fill="#F2B56B"/>
        <path d="M20 32 L14 16 28 22z M66 32 L72 16 58 22z" fill="#E29C55"/>
        <ellipse cx="43" cy="52" rx="16" ry="11" fill="#FFF7EA"/>
        <circle cx="34" cy="38" r="2.6" fill="#3A2E22"/><circle cx="52" cy="38" r="2.6" fill="#3A2E22"/>
        <ellipse cx="43" cy="47" rx="3.2" ry="2.4" fill="#3A2E22"/>
        <path d="M43 49 v2.5 M43 51.5 q-3.4 3.4-7 .6 M43 51.5 q3.4 3.4 7 .6" stroke="#3A2E22" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M68 48 q8 2 6 9" stroke="#E29C55" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <svg style="position:absolute;bottom:36px;right:98px" width="56" height="50" viewBox="0 0 56 50">
        <ellipse cx="28" cy="28" rx="17" ry="14" fill="#FFFDF6" stroke="#3A2E22" stroke-width="2.4"/>
        <path d="M16 18 L12 7 22 12z M40 18 L44 7 34 12z" fill="#FFFDF6" stroke="#3A2E22" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M16.5 16.5 L14.5 10.5 20.5 13.5z" fill="#F5A8A0"/>
        <circle cx="22.5" cy="26" r="1.8" fill="#3A2E22"/><circle cx="33.5" cy="26" r="1.8" fill="#3A2E22"/>
        <path d="M26 31 q2 2 4 0" stroke="#3A2E22" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <ellipse cx="18" cy="30" rx="2.6" ry="1.8" fill="#F5A8A0" opacity=".7"/>
        <ellipse cx="38" cy="30" rx="2.6" ry="1.8" fill="#F5A8A0" opacity=".7"/>
        <path d="M11 34 q-5 1-4 6" stroke="#FFFDF6" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="note">旺旺和小猫咪咪已入驻 · 它们陪你每天浇水</div>
    </div>

    <div class="how">
      <div class="it"><b>答对题目</b><span>种子成长</span></div>
      <span class="arr">→</span>
      <div class="it"><b>完成整组任务</b><span>开出一朵花</span></div>
      <span class="arr">→</span>
      <div class="it"><b>集花兑换</b><span>宠物 / 场景</span></div>
    </div>

    <div class="sec">花田小铺<small>只用花兑换，不花钱</small></div>
    <div class="shop">
      <div class="item one">
        <div class="pic"><svg width="60" height="56" viewBox="0 0 60 56"><ellipse cx="30" cy="50" rx="20" ry="4" fill="rgba(40,70,40,.15)"/><ellipse cx="30" cy="34" rx="19" ry="15" fill="#F2B56B"/><path d="M15 25 L10 12 22 17z M45 25 L50 12 38 17z" fill="#E29C55"/><ellipse cx="30" cy="40" rx="11" ry="8" fill="#FFF7EA"/><circle cx="24" cy="29" r="2" fill="#3A2E22"/><circle cx="36" cy="29" r="2" fill="#3A2E22"/><ellipse cx="30" cy="35" rx="2.4" ry="1.8" fill="#3A2E22"/></svg></div>
        <h5>樱花秋千架</h5><p>咪咪最爱的角落</p>
        <span class="cost"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#E8834A"/><g fill="#F5B840"><ellipse cx="12" cy="4.5" rx="3.4" ry="4.5"/><ellipse cx="12" cy="19.5" rx="3.4" ry="4.5"/><ellipse cx="4.5" cy="12" rx="4.5" ry="3.4"/><ellipse cx="19.5" cy="12" rx="4.5" ry="3.4"/></g></svg>10 朵</span>
        <button class="btn-ex">可兑换</button>
      </div>
      <div class="item two locked">
        <span class="p1tag">P1 商城扩充</span>
        <div class="pic"><svg width="60" height="56" viewBox="0 0 60 56"><path d="M6 42 L54 42 L44 16 L16 16 Z" fill="#fff" stroke="#9BC4D8" stroke-width="2.5"/><path d="M22 42 V30 M38 42 V30 M16 16 Q30 8 44 16" stroke="#9BC4D8" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>
        <h5>雪地小屋场景</h5><p>冬天也不怕冷</p>
        <span class="cost"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#E8834A"/><g fill="#F5B840"><ellipse cx="12" cy="4.5" rx="3.4" ry="4.5"/><ellipse cx="12" cy="19.5" rx="3.4" ry="4.5"/><ellipse cx="4.5" cy="12" rx="4.5" ry="3.4"/><ellipse cx="19.5" cy="12" rx="4.5" ry="3.4"/></g></svg>30 朵</span>
        <button class="btn-ex">还差 18 朵</button>
      </div>
    </div>

    <div class="mybtns">
      <div class="my">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2C7A4B" stroke-width="2"><path d="M4 19V9l8-5 8 5v10" stroke-linejoin="round"/><path d="M10 19v-5h4v5"/></svg></div>
        <div><h6>我的场景</h6><p>阳光草地 · 1 个</p></div>
      </div>
      <div class="my">
        <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F5B840"><ellipse cx="12" cy="15.5" rx="5" ry="4"/><circle cx="6" cy="10" r="2.2"/><circle cx="10" cy="6.6" r="2.2"/><circle cx="14.5" cy="6.8" r="2.2"/><circle cx="18.2" cy="10.4" r="2.2"/></svg></div>
        <div><h6>我的伙伴</h6><p>旺旺 · 1 位</p></div>
      </div>
    </div>
  </div>
  <div class="home-ind"><i></i></div>
</div></div>
</body>
